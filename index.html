<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blood Donation Management System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <h1>Blood Donation Management System</h1>
        <img src="{{ url_for('static', filename='images/blood-drop.png') }}" alt="Blood Drop" class="header-image" />
    </header>

    <section class="add-donor-section">
        <h2>Add Donor</h2>
        <form id="donor-form">
            <input type="text" id="name" placeholder="Donor Name" required />
            <select id="blood_type" required>
                <option value="" disabled selected>Select Blood Type</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
            </select>
            <input type="number" id="quantity" placeholder="Quantity (ml)" min="1" required />
            <button type="submit">Add Donor</button>
        </form>
        <div id="form-message"></div>
    </section>

    <section class="tables-section">
        <div class="table-container">
            <h2>Donors</h2>
            <table id="donors-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Blood Type</th>
                        <th>Quantity (ml)</th>
                        <th>Delete</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Donor rows will be inserted here dynamically -->
                </tbody>
            </table>
        </div>

        <div class="table-container">
            <h2>Blood Inventory</h2>
            <table id="inventory-table">
                <thead>
                    <tr>
                        <th>Blood Type</th>
                        <th>Quantity Available (ml)</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Inventory rows will be inserted here dynamically -->
                </tbody>
            </table>
<canvas id="bloodInventoryChart" width="300" height="300"></canvas>
        </div>
    </section>

    <div id="loading" class="loading-overlay" style="display:none;">
        <div class="spinner"></div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
